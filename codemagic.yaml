workflows:
  ios-swiftui-workflow:
    name: Mon Jardin iOS Build Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Inspect project structure
        script: |
          ls -la
          xcodebuild -list -project MonJardin.xcodeproj
      - name: Build iOS Application for iPhone OS
        script: |
          xcodebuild build \
            -project MonJardin.xcodeproj \
            -scheme MonJardin \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
      - name: Package IPA File
        script: |
          APP_PATH=$(find $HOME/Library/Developer/Xcode/DerivedData -name "MonJardin.app" | head -n 1)
          echo "Found app at: $APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r MonJardin.ipa Payload
    artifacts:
      - "*.ipa"
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.dSYM


