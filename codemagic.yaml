workflows:
  ios-swiftui-workflow:
    name: Mon Jardin iOS Build Workflow
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      xcode: latest
      cocoapods: default
    scripts:
      - name: Inspect project structure
        script: |
          ls -la
          xcodebuild -list -project MonJardin.xcodeproj
      - name: Build iOS Application (Simulator & Unsigned Release)
        script: |
          xcodebuild build \
            -project MonJardin.xcodeproj \
            -scheme MonJardin \
            -sdk iphonesimulator \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.dSYM

